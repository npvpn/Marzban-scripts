# Source host after partner-panel cutover:
# nginx :80/:443 → Marzban on the host (HTTPS :8001 by default).
#
# Started by 11_deploy_source_nginx.sh with project name partner-nginx
# so it does not take down the leftover legacy compose project.

services:
  nginx:
    container_name: nginx_n_nvb
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./etc/nginx/conf:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/data:/var/www/certbot:ro
      - ./var/log/nginx:/var/log/nginx
      - ./volumes/templates/404.html:/usr/share/nginx/html/custom_404.html:ro
      - ./volumes/templates/50x.html:/usr/share/nginx/html/custom_50x.html:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
