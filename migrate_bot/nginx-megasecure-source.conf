# Source host: nginx only — proxies :443 → partner panel on host :8001.
# No docker DNS names (nvb_web, nvb_marz, nvb_grafana) required.
#
# Deploy:
#   cp nginx-megasecure-source.conf → /home/MegaSecureBot/etc/nginx/conf/default.conf
#   docker compose -f docker-compose.nginx-only.yml up -d
#   docker exec nginx_n_nvb nginx -t && docker exec nginx_n_nvb nginx -s reload

upstream partner_marzban {
    server 172.17.0.1:8001;
    keepalive 8;
}

server {
    listen [::]:80;
    listen 80;
    listen [::]:443 ssl;
    listen 443 ssl;
    listen 127.0.0.1:10000 ssl proxy_protocol;

    http2 on;

    server_name app.megasecure.ru;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type "text/plain";
        try_files $uri =404;
    }

    # HTTP → HTTPS (except localhost)
    location / {
        if ($server_port = 80) {
            set $to_https 1;
        }
        if ($host = localhost) {
            set $to_https 0;
        }
        if ($to_https = 1) {
            return 301 https://$host$request_uri;
        }
        return 404;
    }

    # Partner Marzban (/opt/marzban, host network, HTTPS :8001)
    # https://app.megasecure.ru/sub/<token>  (no :8001 in URL)
    location ~* ^/(dashboard|docs|redoc|openapi\.json|api|sub|statics)(/|$) {
        proxy_pass https://partner_marzban;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    error_page 404 /custom_404.html;
    location = /custom_404.html {
        root /usr/share/nginx/html;
    }

    error_page 500 502 503 504 /custom_50x.html;
    location = /custom_50x.html {
        root /usr/share/nginx/html;
    }
}
